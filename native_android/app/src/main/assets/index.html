<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Market Terminal</title><style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#101828;--mu:#667085;--ln:#e4e7ec;--up:#079455;--dn:#d92d20;--ac:#2563eb}
:root[data-theme=dark]{--bg:#070b14;--card:#101827;--tx:#f2f4f7;--mu:#98a2b3;--ln:#1d2939;--up:#32d583;--dn:#ff6b6b;--ac:#70a3ff}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--tx);font:14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:9px;padding:calc(12px + env(safe-area-inset-top)) 12px 10px;background:var(--bg);border-bottom:1px solid var(--ln)}h1{margin:0;flex:1;font-size:21px}.status{font-size:10px;color:var(--mu);white-space:nowrap}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--dn);margin-right:4px}.dot.ok{background:var(--up)}
.form{display:grid;gap:10px}.form input,.form select{width:100%;padding:12px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx)}.form button{padding:12px;border:1px solid var(--ln);border-radius:10px;background:var(--ac);color:white;font-weight:700}.form small{color:var(--mu)}.icon{width:38px;height:38px;border:1px solid var(--ln);border-radius:11px;background:var(--card);font-size:19px}.filters{display:flex;gap:7px;padding:9px 12px;position:sticky;top:59px;z-index:4;background:var(--bg)}.filter{border:1px solid var(--ln);background:var(--card);border-radius:999px;padding:8px 18px;color:var(--mu);font-weight:650}.filter.on{background:var(--tx);color:var(--bg)}
.info{margin:2px 12px 10px;padding:10px 12px;background:var(--card);border:1px solid var(--ln);border-radius:13px;display:flex;justify-content:space-between}.muted{color:var(--mu);font-size:11px}.list{margin:0 12px;border:1px solid var(--ln);border-radius:15px;overflow:hidden;background:var(--card)}.row{width:100%;display:grid;grid-template-columns:1fr auto;gap:10px;padding:14px 13px;text-align:left;border:0;border-bottom:1px solid var(--ln);background:transparent}.row:last-child{border:0}.name{font-weight:700}.ex{font-size:10px;color:var(--mu);margin-left:5px}.price{text-align:right;font-weight:700;font-size:16px}.chg{text-align:right;font-size:11px;margin-top:3px}.up{color:var(--up)}.dn{color:var(--dn)}.empty{text-align:center;padding:40px 20px;color:var(--mu)}.empty b{display:block;color:var(--tx);margin-bottom:6px}.sheet{position:fixed;inset:0;z-index:20;background:#0008;display:flex;align-items:flex-end}.sheet[hidden]{display:none}.panel{width:100%;background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom))}.close{float:right}.big{font-size:34px;font-weight:750;margin:18px 0 3px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--ln);margin-top:18px}.grid>div{background:var(--card);padding:11px}.grid small{display:block;color:var(--mu)}
</style></head><body>
<header class="top"><h1>Market Terminal</h1><div class="status"><span id="dot" class="dot"></span><span id="status">Connecting</span></div><button id="settings" class="icon">⚙</button><button id="theme" class="icon">◐</button><button id="refresh" class="icon">↻</button></header>
<div class="filters"><button class="filter on" data-ex="ALL">All</button><button class="filter" data-ex="NSE">NSE</button><button class="filter" data-ex="BSE">BSE</button></div>
<div class="info"><div><b>Angel One SmartAPI</b><div class="muted">Live quotes · read only · no demo data</div></div><div id="updated" class="muted">—</div></div><main id="list" class="list"><div class="empty"><b>Connecting to live market data…</b>Fake prices are disabled.</div></main><div id="sheet" class="sheet" hidden></div>
<div id="settingsSheet" class="sheet" hidden><div class="panel"><button class="icon close" id="closeSettings">×</button><h2>Connection Settings</h2>
<div class="form">
<small>Secrets are used only for the current connection and are not committed to GitHub.</small>
<input id="backendInput" placeholder="Railway backend URL">
<input id="appTokenInput" placeholder="Backend App Token (optional)" type="password">
<h3>Angel One SmartAPI</h3>
<input id="angelClient" placeholder="Client ID">
<input id="angelPin" placeholder="4-digit MPIN" inputmode="numeric" type="password" maxlength="4">
<input id="angelTotp" placeholder="Current 6-digit TOTP" inputmode="numeric" maxlength="6">
<input id="angelApiKey" placeholder="SmartAPI Application API Key" type="password">
<button id="angelConnect">CONNECT ANGEL ONE</button>
<div id="angelMsg" class="muted"></div>
<h3>AI Access Key</h3>
<select id="aiProvider"><option value="gpt56-luna">GPT-5.6 Luna / OpenAI</option><option value="gpt56-sol">GPT-5.6 Sol / OpenAI</option><option value="claude-sonnet">Claude Sonnet</option><option value="deepseek">DeepSeek Chat</option><option value="gemini-flash">Gemini Flash</option><option value="grok-4">Grok 4</option></select>
<input id="aiAccessKey" placeholder="Provider API / Access Key" type="password">
<button id="aiConnect">CONNECT AI ACCESS KEY</button>
<div id="aiMsg" class="muted"></div>
<button id="closeSettings2">DONE</button>
</div></div></div>
<script>
const $=s=>document.querySelector(s);let rows=[],ex='ALL',base='',token='',timer,lastFetched=localStorage.getItem('market_last_fetched')||'';
const n=v=>{if(v==null||v==='')return null;let x=Number(String(v).replace(/,/g,''));return Number.isFinite(x)?x:null};
const p=(o,ks)=>{for(const k of ks)if(o&&o[k]!=null)return o[k];return null};
function norm(r){let d=r&&r.data,a=Array.isArray(r)?r:Array.isArray(d)?d:d&&Array.isArray(d.fetched)?d.fetched:[];return a.map((x,i)=>{let l=n(p(x,['ltp','LTP','lastTradedPrice','last_traded_price','close','closePrice'])),pc=n(p(x,['previousClose','previous_close','pc','prevClose','close'])),c=n(p(x,['percentChange','percent_change','changePercent','change_percent','pChange']));return{id:i,name:String(p(x,['name','symbol','tradingsymbol','tradingSymbol','indexName'])||'Index'),ex:String(p(x,['exchange','ex','exchangeSegment'])||'').toUpperCase().includes('BSE')?'BSE':'NSE',ltp:l,pc,change:c??(l!=null&&pc?100*(l/pc-1):null)}}).filter(x=>x.ltp!=null)}
function saveLastFetch(){try{localStorage.setItem('market_last_rows',JSON.stringify(rows));localStorage.setItem('market_last_fetched',lastFetched)}catch(e){}}
function restoreLastFetch(){try{let raw=localStorage.getItem('market_last_rows');let cached=raw?JSON.parse(raw):[];if(Array.isArray(cached)&&cached.length){rows=cached;return true}}catch(e){}return false}
function render(cached=false){let a=rows.filter(x=>ex==='ALL'||x.ex===ex);if(!a.length){$('#list').innerHTML='<div class="empty"><b>Live data not available</b>Connect Angel One and configure the backend, then refresh.</div>';return}$('#list').innerHTML=a.map((x,i)=>{let up=(x.change??0)>=0;return'<button class="row" data-i="'+i+'"><div><div class="name">'+x.name+'<span class="ex">'+x.ex+'</span></div><div class="muted">Angel One SmartAPI · '+(cached?'last fetched':'live')+'</div></div><div><div class="price '+(up?'up':'dn')+'">'+x.ltp.toLocaleString('en-IN',{maximumFractionDigits:2})+'</div><div class="chg '+(up?'up':'dn')+'">'+(x.change==null?'—':(up?'▲ ':'▼ ')+Math.abs(x.change).toFixed(2)+'%')+'</div></div></button>'}).join('');if(cached){$('#updated').textContent=lastFetched?'Last fetched '+lastFetched:'Using last fetched data'}}
async function get(path){let h={};if(token)h['x-token']=token;let r=await fetch(base.replace(/\/$/,'')+path,{headers:h,cache:'no-store'});if(!r.ok)throw Error(r.status);return r.json()}
async function load(){try{let h=await get('/health');let ok=h.angel_connected===true;if(!ok){let restored=restoreLastFetch();$('#status').textContent='Market closed · last fetched';$('#dot').classList.remove('ok');if(restored){render(true)}else{rows=[];render();$('#updated').textContent='No previous fetch'}return}let fresh=norm(await get('/v1/angel/indices'));if(!fresh.length)throw Error('empty live data');rows=fresh;lastFetched=new Date().toLocaleString('en-IN',{hour12:false});saveLastFetch();$('#status').textContent='LIVE';$('#dot').classList.add('ok');render(false);$('#updated').textContent='Updated '+lastFetched}catch(e){let restored=restoreLastFetch();$('#status').textContent=restored?'Live unavailable · last fetched':'Backend unavailable';$('#dot').classList.remove('ok');if(restored){render(true)}else{rows=[];render();$('#updated').textContent='Retrying…'}}}
function detail(x){let up=(x.change??0)>=0;$('#sheet').hidden=false;$('#sheet').innerHTML='<div class="panel"><button class="icon close" data-close>×</button><div class="muted">'+x.ex+' · Angel One SmartAPI</div><h2>'+x.name+'</h2><div class="big '+(up?'up':'dn')+'">'+x.ltp.toLocaleString('en-IN',{maximumFractionDigits:2})+'</div><div class="'+(up?'up':'dn')+'">'+(x.change==null?'—':(up?'▲ ':'▼ ')+Math.abs(x.change).toFixed(2)+'%')+'</div><div class="grid"><div><small>Previous close</small><b>'+(x.pc==null?'—':x.pc.toLocaleString('en-IN',{maximumFractionDigits:2}))+'</b></div><div><small>Exchange</small><b>'+x.ex+'</b></div><div><small>Source</small><b>Angel One SmartAPI</b></div><div><small>Mode</small><b>Read only</b></div></div></div>'}
document.addEventListener('click',e=>{let f=e.target.closest('[data-ex]');if(f){ex=f.dataset.ex;document.querySelectorAll('[data-ex]').forEach(b=>b.classList.toggle('on',b===f));render();return}let r=e.target.closest('.row');if(r){let a=rows.filter(x=>ex==='ALL'||x.ex===ex);detail(a[+r.dataset.i]);return}if(e.target.closest('[data-close]')||e.target===$('#sheet'))$('#sheet').hidden=true});
function headers(){return token?{'x-token':token,'Content-Type':'application/json'}:{'Content-Type':'application/json'}}
function openSettings(){ $('#settingsSheet').hidden=false; $('#backendInput').value=base; $('#appTokenInput').value=token; }
function closeSettings(){ $('#settingsSheet').hidden=true; }
async function postJson(path,body){let r=await fetch(base.replace(/\/$/,'')+path,{method:'POST',headers:headers(),body:JSON.stringify(body)});let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw Error((d.detail&&d.detail.message)||d.detail||d.message||('HTTP '+r.status));return d}
$('#settings').onclick=openSettings;$('#closeSettings').onclick=closeSettings;$('#closeSettings2').onclick=closeSettings;
$('#backendInput').onchange=e=>{base=e.target.value.trim().replace(/\/$/,'');localStorage.setItem('dash_api_base',base)};
$('#appTokenInput').onchange=e=>{token=e.target.value.trim()};
$('#angelConnect').onclick=async()=>{const msg=$('#angelMsg');msg.textContent='Connecting…';try{base=$('#backendInput').value.trim().replace(/\/$/,'');token=$('#appTokenInput').value.trim();if(!base)throw Error('Backend URL required');const d=await postJson('/v1/angel/login',{clientId:$('#angelClient').value.trim(),pin:$('#angelPin').value.trim(),totp:$('#angelTotp').value.trim(),apiKey:$('#angelApiKey').value.trim()});msg.textContent=d.connected?'CONNECTED • Angel One SmartAPI':(d.message||'Login failed');load()}catch(e){msg.textContent='Angel login failed: '+e.message}};
$('#aiConnect').onclick=async()=>{const msg=$('#aiMsg');msg.textContent='Connecting…';try{const d=await postJson('/v1/ai/access-key',{providerId:$('#aiProvider').value,accessKey:$('#aiAccessKey').value.trim()});$('#aiAccessKey').value='';msg.textContent=d.ok?'CONNECTED • AI Access Key':'AI connection failed'}catch(e){msg.textContent='AI connection failed: '+e.message}};
$('#refresh').onclick=load;$('#theme').onclick=()=>{let d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark';localStorage.setItem('market_theme',d.dataset.theme)};
let saved=localStorage.getItem('market_theme');if(saved)document.documentElement.dataset.theme=saved;
window.setBackendUrl=function(u){localStorage.setItem('dash_api_base',u);base=u;load()};
window.bootstrapDashboard=function(){base=window.DASH_API_BASE||localStorage.getItem('dash_api_base')||'https://nse-algo-backend-live-production.up.railway.app';token=window.DASH_TOKEN||localStorage.getItem('dash_token')||'';load();clearInterval(timer);timer=setInterval(load,2500)};
if(window.DASH_API_BASE||localStorage.getItem('dash_api_base'))window.bootstrapDashboard();
</script></body></html>
