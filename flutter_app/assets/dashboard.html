<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NSE Algo Signal</title><style>
:root{color-scheme:dark;--bg:#0a1018;--c:#111a26;--l:#263448;--i:#e9f0f7;--m:#91a0b4;--a:#38b6f5;--u:#3ddc97;--d:#ff6b7d;--w:#f5bf4f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font:14px system-ui;padding-bottom:70px}.w{max-width:760px;margin:auto;padding:12px}header{position:sticky;top:0;z-index:5;background:#0a1018ee;backdrop-filter:blur(10px);border-bottom:1px solid var(--l)}.bar{display:flex;align-items:center;gap:8px;min-height:58px}.brand{flex:1}.brand b{display:block;font-size:18px}.brand small{color:var(--m);font-size:12px}.btn{width:42px;height:42px;border:1px solid var(--l);background:var(--c);border-radius:12px;color:var(--i);display:grid;place-items:center}.ring{width:27px;height:27px;border-radius:50%;border:2px solid var(--l);display:grid;place-items:center;font:600 10px monospace;position:relative}.ring:before{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid transparent;border-top-color:var(--a);transform:rotate(-45deg)}.ring.paused:before{border-top-color:var(--w)}main{display:grid;gap:12px}.card{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:15px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:var(--m)}.ltp{font:600 36px monospace}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.s{background:#182333;border-radius:12px;padding:10px}.s small{display:block;color:var(--m);font-size:10px}.s b{display:block;margin-top:3px}.p{display:inline-block;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:700;background:#182333}.u{color:var(--u)}.d{color:var(--d)}h2{font-size:12px;color:var(--m);letter-spacing:.08em;text-transform:uppercase;margin:0 0 11px}.lev{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.lev>div{background:#182333;border-radius:11px;padding:10px}.lev small{color:var(--m);display:block}.lev b{font:600 16px monospace}.track{height:9px;border-radius:20px;background:linear-gradient(90deg,#55202a 0 33%,#554819 33% 66%,#123d2d 66%);margin-top:15px}.chain{overflow:auto}table{width:100%;min-width:480px;border-collapse:collapse;font:12px monospace}th,td{padding:7px;border-bottom:1px solid var(--l);text-align:right}th{color:var(--m);font:10px system-ui;text-transform:uppercase}.atm{background:#0e2a3d}.kv{display:grid;grid-template-columns:1fr auto}.kv div{padding:8px 0;border-bottom:1px solid var(--l)}.kv div:nth-child(odd){color:var(--m)}.sheet{position:fixed;inset:0;background:#0009;z-index:20;display:flex;align-items:flex-end}.panel{background:var(--c);width:100%;max-width:600px;margin:auto;border-radius:20px 20px 0 0;padding:18px}.f{margin:12px 0}.f label{display:block;color:var(--m);font-size:11px;margin-bottom:6px}.f input{width:100%;height:44px;border-radius:10px;border:1px solid var(--l);background:var(--bg);color:var(--i);padding:0 10px}.check{display:flex;gap:10px;margin:12px 0}.actions{display:flex;gap:8px}.actions button{flex:1;height:44px;border-radius:10px;border:1px solid var(--l);background:#182333;color:var(--i)}.actions .save{background:var(--a);color:#06121d;border:0}.dock{position:fixed;bottom:0;left:0;right:0;padding:10px 14px;background:#0a1018ee}.dock button{width:100%;max-width:760px;display:block;margin:auto;height:48px;border:0;border-radius:14px;background:var(--a);font-weight:800;color:#06121d}@media(max-width:420px){.g,.lev{grid-template-columns:1fr 1fr}.ltp{font-size:30px}}
</style></head><body><header><div class="w bar"><div class="brand"><b>NSE Algo Signal</b><small id="sub">Waiting for first snapshot · auto 5s</small></div><button class="btn" id="rf">↻</button><button class="btn" id="at"><span class="ring" id="ring"><span id="count">5</span></span></button><button class="btn" id="st">⚙</button></div></header><main class="w"><section class="card"><div class="row"><div><div class="muted" id="sym">Underlying</div><div class="ltp" id="ltp">DATA UNAVAILABLE</div></div><div><span class="p" id="mkt">MARKET</span><br><span class="p" id="eng">ENGINE</span></div></div><div class="g"><div class="s"><small>ATM</small><b id="atm">—</b></div><div class="s"><small>PCR</small><b id="pcr">—</b></div><div class="s"><small>Trend</small><b id="tr">—</b></div></div></section><section class="card"><h2>Signal</h2><div id="sig" class="muted">Waiting for snapshot.</div></section><section class="card"><h2>Open Interest</h2><div id="oi" class="muted">DATA UNAVAILABLE</div></section><section class="card"><h2>Option Chain</h2><div class="chain"><table id="chain"></table></div></section><section class="card"><h2>Current Engine State</h2><div class="kv" id="state"></div></section><section class="card"><div class="row"><b>Connection</b><span id="conn" class="p">Connecting</span></div><div class="muted" style="margin-top:8px">Paper signals only. No order placement.</div></section></main><div class="dock"><button id="dock">REFRESH LIVE ENGINE</button></div><div class="sheet" id="sheet" hidden><div class="panel"><h3>Dashboard Settings</h3><div class="f"><label>Backend URL</label><input id="base" placeholder="https://your-railway-service"></div><div class="f"><label>Dashboard token</label><input id="token" type="password"></div><div class="f"><label>Refresh interval: 2–60 seconds</label><input id="every" type="number" min="2" max="60"></div><label class="check"><input id="auto" type="checkbox"><span><b>Auto refresh</b><br><span class="muted">Saved on this phone. Tap the countdown ring to pause/resume.</span></span></label><label class="check"><input id="demo" type="checkbox"><span>Demo preview</span></label><div class="actions"><button id="cancel">Cancel</button><button class="save" id="save">Save</button></div></div></div>
<script>
(()=>{const $=id=>document.getElementById(id),K='parmar.dashboard.v3';let c={base:'',token:'',every:5,auto:true,demo:false};try{Object.assign(c,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}c.every=Math.max(2,Math.min(60,+c.every||5));let d=null,busy=false,left=c.every,t=null;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(c))}catch(e){}};const sub=()=>{$('sub').textContent=d?((d.symbol||'NSE')+' · Updated '+new Date(d.ts||Date.now()).toLocaleTimeString('en-IN')+' · '+(c.auto?'auto '+c.every+'s':'paused')):('Waiting for first snapshot · '+(c.auto?'auto '+c.every+'s':'paused'));$('count').textContent=c.auto?left:'▶';$('ring').classList.toggle('paused',!c.auto)};
const demo=()=>({ts:new Date().toISOString(),symbol:'NIFTY',expiry:'DEMO',market:{open:true,label:'MARKET OPEN'},engine:{status:'LIVE'},underlying_ltp:24850+Math.round(Math.sin(Date.now()/6e4)*30),atm:24900,pcr:1.21,trend:'BULLISH',signal:{status:'ACTIVE',side:'CE',option_symbol:'NIFTYDEMOCE',strike:24900,entry:120,stop_loss:90,target:180,option_ltp:132,reason:'Demo preview only'},chain:Array.from({length:13},(_,i)=>{let k=24600+i*50;return{strike:k,ce:{oi:800000+i*30000,oi_chg:(i-6)*12000},pe:{oi:900000+(12-i)*30000,oi_chg:(6-i)*12000}}})});
async function refresh(){if(busy)return;busy=true;try{d=c.demo?demo():await fetch((c.base||'').replace(/\/+$/,'')+'/api/snapshot?symbol=NIFTY',{headers:c.token?{'X-Dash-Token':c.token}:{},cache:'no-store'}).then(async r=>{if(!r.ok)throw Error(r.status===401?'Dashboard token rejected':'Server returned '+r.status);return r.json()});$('conn').textContent='Connected';$('conn').className='p u'}catch(e){$('conn').textContent='Offline';$('conn').className='p d'}finally{busy=false;left=c.every;render();sub()}}
const n=v=>v==null?'DATA UNAVAILABLE':Number(v).toLocaleString('en-IN',{maximumFractionDigits:2});
function render(){if(!d)return;$('sym').textContent=(d.symbol||'NSE')+' spot';$('ltp').textContent=n(d.underlying_ltp);$('atm').textContent=n(d.atm);$('pcr').textContent=n(d.pcr);$('tr').textContent=d.trend||'DATA UNAVAILABLE';let s=d.signal||null;$('sig').innerHTML=s?'<div class="row"><b>'+n(s.option_symbol)+'</b><span class="p '+(s.side==='CE'?'u':'d')+'">'+(s.status||'ACTIVE')+'</span></div><div class="lev"><div><small>Entry</small><b>'+n(s.entry)+'</b></div><div><small>Stop Loss</small><b class="d">'+n(s.stop_loss)+'</b></div><div><small>Target</small><b class="u">'+n(s.target)+'</b></div></div><div class="track"></div><p class="muted">'+(s.reason||'')+'</p>':'No active signal';let ch=d.chain||[];$('oi').textContent=ch.length?'CE/PE OI snapshot across ATM ±6 strikes':'DATA UNAVAILABLE';$('chain').innerHTML=ch.length?'<tr><th>CE OI</th><th>CE ΔOI</th><th>Strike</th><th>PE ΔOI</th><th>PE OI</th></tr>'+ch.map(r=>'<tr class="'+(r.strike===d.atm?'atm':'')+'"><td>'+n(r.ce?.oi)+'</td><td>'+n(r.ce?.oi_chg)+'</td><td>'+n(r.strike)+'</td><td>'+n(r.pe?.oi_chg)+'</td><td>'+n(r.pe?.oi)+'</td></tr>').join(''):'<tr><td>DATA UNAVAILABLE</td></tr>';let rows=[['Symbol',d.symbol],['Underlying LTP',d.underlying_ltp],['ATM',d.atm],['PCR',d.pcr],['Trend',d.trend],['Signal Status',s?.status],['Strike',s?.strike],['Entry',s?.entry],['Stop Loss',s?.stop_loss],['Target',s?.target]];$('state').innerHTML=rows.map(x=>'<div>'+x[0]+'</div><div>'+n(x[1])+'</div>').join('')}
function schedule(){clearInterval(t);left=c.every;sub();if(!c.auto)return;t=setInterval(()=>{if(document.hidden||busy)return;if(--left<=0){left=c.every;refresh()}sub()},1000)}
$('at').onclick=()=>{c.auto=!c.auto;save();schedule();if(c.auto)refresh()};$('rf').onclick=()=>{left=c.every;refresh()};$('dock').onclick=()=>{left=c.every;refresh()};$('st').onclick=()=>{$('base').value=c.base;$('token').value=c.token;$('every').value=c.every;$('auto').checked=c.auto;$('demo').checked=c.demo;$('sheet').hidden=false};$('cancel').onclick=()=>{$('sheet').hidden=true};$('save').onclick=()=>{c.base=$('base').value.trim();c.token=$('token').value.trim();c.every=Math.max(2,Math.min(60,+$('every').value||5));c.auto=$('auto').checked;c.demo=$('demo').checked;save();$('sheet').hidden=true;schedule();refresh()};document.addEventListener('visibilitychange',()=>{if(document.hidden)clearInterval(t);else{schedule();refresh()}});sub();schedule();refresh()})();
</script></body></html>
