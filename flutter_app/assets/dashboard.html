<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Market Terminal · Angel One</title><style>:root{--bg:#F2F4F9;--s1:#fff;--s2:#E8ECF4;--tx:#0E1628;--mu:#5A6781;--ln:#DCE2ED;--up:#0B9A60;--dn:#DE3E45;--ac:#2D68F5}@media(prefers-color-scheme:dark){:root{--bg:#0A1020;--s1:#111A2E;--s2:#1B2740;--tx:#E8EDF7;--mu:#8D9BB8;--ln:#222F4A;--up:#2BD08A;--dn:#FF6369;--ac:#5B8CFF}}*{box-sizing:border-box}body{margin:0;padding-bottom:76px;background:var(--bg);color:var(--tx);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button{font:inherit;color:inherit}.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 18px 10px;background:var(--bg)}h1{margin:0;font-size:27px}.acts{display:flex;gap:8px}.ib{width:40px;height:40px;border:0;border-radius:12px;background:var(--s1);cursor:pointer}.src{margin:4px 16px;padding:12px 14px;background:var(--s1);border-radius:14px;display:flex;gap:12px}.src div:nth-child(2){flex:1}.sub{color:var(--mu);font-size:12px}.dot{width:9px;height:9px;margin-top:5px;border-radius:50%;background:var(--up)}.chips{display:flex;gap:8px;overflow:auto;padding:14px 16px 8px}.chip{white-space:nowrap;border:1px solid var(--ln);background:transparent;color:var(--mu);padding:7px 14px;border-radius:999px}.chip.on{background:var(--tx);color:var(--bg)}.bread{margin:4px 16px 10px}.bar{height:6px;display:flex;gap:2px;margin-top:7px}.bar i{display:block;height:100%}.list{margin:4px 16px;background:var(--s1);border-radius:16px;overflow:hidden}.row{width:100%;display:grid;grid-template-columns:1fr 70px auto;gap:10px;align-items:center;padding:14px;border:0;border-bottom:1px solid var(--ln);background:none;text-align:left}.nm{font-weight:600}.price{text-align:right;font-weight:600;font-size:17px}.up{color:var(--up)}.dn{color:var(--dn)}.chg{font-size:12px;margin-top:3px}.spark{width:64px;height:24px}.nav{position:fixed;bottom:0;left:0;right:0;z-index:8;display:flex;padding:6px 12px;background:var(--s1);border-top:1px solid var(--ln)}.nav button{flex:1;border:0;background:none;padding:9px;color:var(--mu)}.nav .on{color:var(--ac);font-weight:600}.sheet{position:fixed;inset:0;z-index:20;background:#0008;display:flex;align-items:flex-end}.card{width:100%;max-height:90%;overflow:auto;background:var(--s1);border-radius:22px 22px 0 0;padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--ln);margin-top:14px}.grid div{background:var(--s1);padding:10px}.grid small{display:block;color:var(--mu)}.big{font-size:34px;font-weight:600;margin-top:12px}</style></head><body><header class="top"><h1 id="title">Market</h1><div class="acts"><button class="ib" id="refresh" aria-label="Refresh">↻</button><button class="ib" id="theme" aria-label="Theme">◐</button></div></header><main id="app"></main><nav class="nav"><button class="on" data-tab="market">Market</button><button data-tab="commodity">Commodity</button></nav><div id="sheet" class="sheet" hidden></div><script>
const $=s=>document.querySelector(s),app=$('#app');let tab='market',filter='all',sort='default',selected=null,seed=11;const rnd=()=>{seed=seed*16807%2147483647;return seed/2147483647};const fmt=(n,d=2)=>Number(n??0).toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d});const pct=x=>(x.ltp/x.pc-1)*100;const series=p=>Array.from({length:30},()=>p*(1+(rnd()-.5)*.012));const indices=[['NIFTY 50','NSE',24980.35,.12],['NIFTY BANK','NSE',55240.1,-.31],['FINNIFTY','NSE',26115.4,.08],['MIDCPNIFTY','NSE',12640.25,-.74],['SENSEX','BSE',81420.55,.10],['BANKEX','BSE',61356.13,-.60],['S&P BSE 100','BSE',24259.47,-.05],['S&P BSE 150 MidCap','BSE',15997.57,-.99],['S&P BSE 200','BSE',10870.01,-.07],['S&P BSE 250 LargeMidCap','BSE',10082.45,-.96],['S&P BSE 400 MidSmallCap','BSE',12074.21,-1.07],['S&P BSE 500','BSE',35169.62,-.85]].map((x,i)=>({id:'i'+i,n:x[0],ex:x[1],ltp:x[2],pc:x[2]/(1+x[3]/100),d:2,s:series(x[2])}));const commodities=[['Crude Oil','CRUDE',1099.8,3.2],['Crude Oil Mini','CRUDE',1632.7,1.8],['Natural Gas','GAS',13.1,-2.4],['Nat Gas Mini','GAS',15.75,4.1],['Gold','GOLD',147866,.35],['Gold Mini','GOLD',147729,.31]].map((x,i)=>({id:'c'+i,n:x[0],g:x[1],ex:'MCX',ltp:x[2],pc:x[2]/(1+x[3]/100),d:x[2]<100?2:1,s:series(x[2]),oi:1000+i*240,oc:(i-2)*35}));const arr=()=>tab==='market'?indices:commodities;const spark=a=>{let mn=Math.min(...a),mx=Math.max(...a),r=mx-mn||1;return a.map((v,i)=>((i/29)*64).toFixed(1)+','+(22-(v-mn)/r*18).toFixed(1)).join(' ')};function render(){let a=arr();if(filter!=='all')a=a.filter(x=>tab==='market'?x.ex===filter:x.g===filter);if(sort!=='default')a=[...a].sort((x,y)=>(pct(y)-pct(x))*(sort==='gainers'?1:-1));$('#title').textContent=tab==='market'?'Market':'Commodity';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));let chips=tab==='market'?['all','NSE','BSE']:['all','CRUDE','GAS','GOLD'];app.innerHTML='<div class="src"><span class="dot"></span><div><b>Angel One SmartAPI</b><div class="sub">'+(tab==='market'?'NSE + BSE index universe':'MCX current contracts')+'</div></div><div class="sub">Live backend<br>'+new Date().toLocaleTimeString('en-IN',{hour12:false})+'</div></div>'+(tab==='market'?'<div class="bread" id="bread"></div>':'')+'<div class="chips">'+chips.map(c=>'<button class="chip '+(filter===c?'on':'')+'" data-filter="'+c+'">'+(c==='all'?'All':c)+'</button>').join('')+(tab==='market'?'<button class="chip" data-sort>Sort: '+sort+'</button>':'')+'</div><div class="list">'+a.map(x=>'<button class="row" data-id="'+x.id+'"><div><div class="nm">'+x.n+' <span class="sub">'+x.ex+'</span></div><svg class="spark" viewBox="0 0 64 24"><polyline points="'+spark(x.s)+'" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></div><div class="price '+(x.ltp>=x.pc?'up':'dn')+'">'+fmt(x.ltp,x.d)+'</div><div class="chg '+(x.ltp>=x.pc?'up':'dn')+'">'+(x.ltp>=x.pc?'▲':'▼')+' '+Math.abs(pct(x)).toFixed(2)+'%</div></button>').join('')+'</div>';if(tab==='market'){let u=indices.filter(x=>x.ltp>=x.pc).length;$('#bread').innerHTML='<div class="sub"><span class="up">'+u+' rising</span> · <span class="dn">'+(indices.length-u)+' falling</span></div><div class="bar"><i style="flex:'+u+';background:var(--up)"></i><i style="flex:'+(indices.length-u)+';background:var(--dn)"></i></div>'}}function show(x){selected=x;let up=x.ltp>=x.pc,rows=[['Exchange',x.ex],['Previous close',fmt(x.pc,x.d)],['Day high',fmt(Math.max(...x.s),x.d)],['Day low',fmt(Math.min(...x.s),x.d)]];if(x.g)rows.push(['Open interest',fmt(x.oi,0)],['OI change',(x.oc>=0?'+':'')+fmt(x.oc,0)],['Source','Angel One SmartAPI']);$('#sheet').hidden=false;$('#sheet').innerHTML='<div class="card"><button class="ib" data-close>×</button><div class="nm">'+x.n+'</div><div class="sub">'+x.ex+'</div><div class="big '+(up?'up':'dn')+'">'+fmt(x.ltp,x.d)+'</div><div class="'+(up?'up':'dn')+'">'+(up?'▲':'▼')+' '+Math.abs(pct(x)).toFixed(2)+'%</div><div class="grid">'+rows.map(r=>'<div><small>'+r[0]+'</small><b>'+r[1]+'</b></div>').join('')+'</div><p class="sub">Live ticks are supplied by the configured backend. Angel One credentials remain server-side.</p></div>'}app.addEventListener('click',e=>{let c=e.target.closest('[data-filter]'),r=e.target.closest('.row');if(c){filter=c.dataset.filter;render()}else if(e.target.closest('[data-sort]')){sort=sort==='default'?'gainers':sort==='gainers'?'losers':'default';render()}else if(r)show(arr().find(x=>x.id===r.dataset.id))});$('.nav').onclick=e=>{let b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;filter='all';sort='default';render()}};$('#sheet').onclick=e=>{if(e.target.id==='sheet'||e.target.closest('[data-close]'))$('#sheet').hidden=true};$('#theme').onclick=()=>{let d=document.documentElement,c=d.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');d.dataset.theme=c==='dark'?'light':'dark'};$('#refresh').onclick=()=>{arr().forEach(x=>{let o=x.ltp;x.ltp=Math.max(.01,+(o*(1+(rnd()-.5)*.002)).toFixed(x.d));x.s.push(x.ltp);x.s.shift()});render()};render();setInterval(()=>$('#refresh').click(),1300);
</script></body></html>
