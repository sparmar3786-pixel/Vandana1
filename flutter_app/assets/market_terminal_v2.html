<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Market Terminal · Angel One</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#F2F4F9;--s1:#fff;--s2:#E8ECF4;--tx:#0E1628;--mu:#5A6781;--ln:#DCE2ED;--up:#0B9A60;--dn:#DE3E45;--ac:#2D68F5;--am:#B7791F;--upb:rgba(11,154,96,.12);--dnb:rgba(222,62,69,.12)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1020;--s1:#111A2E;--s2:#1B2740;--tx:#E8EDF7;--mu:#8D9BB8;--ln:#222F4A;--up:#2BD08A;--dn:#FF6369;--ac:#5B8CFF;--am:#F0B429;--upb:rgba(43,208,138,.14);--dnb:rgba(255,99,105,.14)}}
:root[data-theme="dark"]{--bg:#0A1020;--s1:#111A2E;--s2:#1B2740;--tx:#E8EDF7;--mu:#8D9BB8;--ln:#222F4A;--up:#2BD08A;--dn:#FF6369;--ac:#5B8CFF;--am:#F0B429;--upb:rgba(43,208,138,.14);--dnb:rgba(255,99,105,.14)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*,*::before,*::after{box-sizing:inherit}[hidden]{display:none!important}
body{margin:0;padding-bottom:84px;background:var(--bg);color:var(--tx);font:15px/1.35 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px;background:var(--bg)}
h1{margin:0;font-size:27px;font-weight:600;letter-spacing:-.02em}.acts{display:flex;gap:8px}.ib{width:40px;height:40px;border-radius:12px;border:0;background:var(--s1);display:grid;place-items:center;cursor:pointer}.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}.src{margin:4px 16px 0;padding:12px 14px;background:var(--s1);border-radius:14px;display:flex;gap:12px;align-items:center}.src>div:nth-child(2){flex:1}.rt{text-align:right}.dot{width:9px;height:9px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 22%,transparent)}.dot.ok{background:var(--up)}.dot.bad{background:var(--dn)}
.sub{color:var(--mu);font-size:12px;margin-top:2px}.u{color:var(--up)}.d{color:var(--dn)}.bw{margin:12px 16px 0}.br{display:flex;gap:2px;height:6px;margin-top:7px;border-radius:3px;overflow:hidden}.br span{display:block;height:100%}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 8px;scrollbar-width:none}.chip{flex:none;border:1px solid var(--ln);background:transparent;color:var(--mu);padding:7px 14px;border-radius:999px;font-size:13px;cursor:pointer}.chip[aria-pressed="true"]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.list{margin:4px 16px 0;background:var(--s1);border-radius:16px;overflow:hidden}.row{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr 56px auto;gap:12px;align-items:center;width:100%;padding:14px;border-bottom:1px solid var(--ln);cursor:pointer}.row:last-child{border-bottom:0}.row:active{background:var(--s2)}.nm{font-weight:600;overflow-wrap:anywhere}.tg{font-size:11px;font-weight:500;color:var(--mu);border:1px solid var(--ln);border-radius:6px;padding:1px 6px;vertical-align:1px}.bd{font-size:11px;font-weight:600;padding:2px 6px;border-radius:6px;vertical-align:1px;white-space:nowrap}.bd.CE{background:var(--upb);color:var(--up)}.bd.PE{background:var(--dnb);color:var(--dn)}.bd.FUT{background:color-mix(in srgb,var(--ac) 16%,transparent);color:var(--ac)}.dx{margin-left:4px;padding:1px 6px;border-radius:6px;background:var(--s2);font-weight:500}.dx.hot{color:var(--am)}.rg{position:relative;height:4px;margin-top:10px;border-radius:2px;background:var(--s2)}.rg i{position:absolute;top:-3px;left:50%;width:3px;height:10px;border-radius:2px;background:var(--tx);transform:translateX(-50%)}.oib{height:4px;margin-top:6px;border-radius:2px;background:var(--s2);overflow:hidden}.oib b{display:block;height:100%;border-radius:2px;background:var(--ac)}.sp{width:56px;height:24px;color:var(--dn)}.sp.u{color:var(--up)}.pr{min-width:86px;text-align:right}.lt{display:inline-block;padding:0 4px;border-radius:6px;font-size:17px;font-weight:600}.lt.fu{animation:fu .7s}.lt.fd{animation:fd .7s}@keyframes fu{from{background:var(--upb)}to{background:transparent}}@keyframes fd{from{background:var(--dnb)}to{background:transparent}}.ch{display:inline-block;margin-top:3px;padding:2px 7px;border-radius:7px;font-size:12px;font-weight:500}.ch.u{background:var(--upb)}.ch.d{background:var(--dnb)}.cp{font-size:12px;color:var(--mu);margin-top:3px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;gap:6px;padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px));background:var(--s1);border-top:1px solid var(--ln)}.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border:0;border-radius:12px;background:none;color:var(--mu);font-size:12px;font-weight:500;cursor:pointer}.nav button[aria-selected="true"]{color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent)}.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;background:rgba(5,10,20,.55)}.card{width:100%;max-height:90%;overflow:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));background:var(--s1);border-radius:22px 22px 0 0;animation:sl .22s ease-out}@keyframes sl{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}.hd{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.big{font-size:34px;font-weight:600;letter-spacing:-.02em;margin-top:10px}.ch2{display:block;width:100%;height:auto;margin:14px 0;color:var(--dn)}.ch2.u{color:var(--up)}.gr{display:grid;grid-template-columns:1fr 1fr;gap:1px;border-radius:12px;overflow:hidden;background:var(--ln)}.gr div{padding:10px 12px;background:var(--s1);overflow-wrap:anywhere}.gr small{display:block;color:var(--mu);font-size:12px}.gr b{font-weight:600}.note{margin:14px 0 0;line-height:1.45}.err{margin:12px 16px;padding:10px 12px;border-radius:12px;background:var(--dnb);color:var(--dn);font-size:12px}.live{color:var(--up)}.sample{color:var(--am)}@media(prefers-reduced-motion:reduce){.lt.fu,.lt.fd,.card{animation:none}}
</style>
</head>
<body>
<header class="top"><h1 id="ttl">Market</h1><div class="acts">
<button class="ib" id="rf" aria-label="Refresh prices"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/></svg></button>
<button class="ib" id="th" aria-label="Switch theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16"/></svg></button></div></header>
<main id="app"></main>
<nav class="nav" aria-label="Sections"><button data-t="m" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Market</button><button data-t="c" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9 9.5h5a1.8 1.8 0 0 1 0 3.5h-4a1.8 1.8 0 0 0 0 3.5h5M12 7.5v1.8M12 16.7v1.8"/></svg>Commodity</button></nav>
<div id="sh" class="sheet" hidden></div>
<script>
const $=s=>document.querySelector(s),app=$('#app');
let API=(window.DASH_API_BASE||localStorage.getItem('dash_api_base')||'').replace(/\/$/,'');
let TOKEN=window.DASH_TOKEN||localStorage.getItem('dash_token')||'';
const apiHeaders=()=>TOKEN?{'X-Dash-Token':TOKEN,'X-App-Key':TOKEN}: {};
const urls=p=>[API+p,(API?API:'')+'/api'+p,(API?API:'')+'/v1'+p];
async function getJson(path){
  const seen=new Set(), errors=[];
  for(const u of urls(path)){if(seen.has(u))continue;seen.add(u);try{const r=await fetch(u,{headers:apiHeaders(),cache:'no-store'});if(r.ok)return await r.json();errors.push(r.status+' '+u)}catch(e){errors.push(String(e))}}
  throw new Error(errors.join(' · ')||'Backend unavailable');
}
function wsUrls(){const base=API||location.origin;const u=new URL(base,location.href);u.protocol=u.protocol==='https:'?'wss: 'ws:';u.protocol=u.protocol.trim();return [...new Set([u.origin.replace(/^http/,'ws')+'/ws',u.origin.replace(/^http/,'ws')+'/v1/ws'])].map(x=>TOKEN?x+'?token='+encodeURIComponent(TOKEN):x)}
let seed=11;const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
const fmt=(n,d=2)=>Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=x=>Number(x.pc)?(Number(x.ltp)/Number(x.pc)-1)*100:0;
const walk=(e,n,v)=>{const a=[Number(e)||0];for(let i=1;i<n;i++)a.unshift(a[0]*(1+(rnd()-.5)*2*v));return a};
const mk=o=>Object.assign(o,{pc:o.pc??o.ltp, s:o.s||walk(o.ltp,40,.0007), hi:o.hi??o.ltp, lo:o.lo??o.ltp});
const fallbackIDX=[['nifty','NIFTY 50','NSE',24980.35,.12],['bank','NIFTY BANK','NSE',55240.1,-.31],['fin','FINNIFTY','NSE',26115.4,.08],['mid','MIDCPNIFTY','NSE',12640.25,-.74],['sensex','SENSEX','BSE',81420.55,.1],['bankex','BANKEX','BSE',61356.13,-.6]].map(a=>mk({id:a[0],n:a[1],ex:a[2],ltp:a[3],pc:a[3]/(1+a[4]/100),d:2,idx:1}));
const fallbackCOM=[['CRUDEOIL','Crude Oil','MCX',1099.8,3.2],['CRUDEOILM','Crude Oil Mini','MCX',1632.7,1.8],['NATURALGAS','Natural Gas','MCX',13.1,-2.4],['NATGASMINI','Nat Gas Mini','MCX',15.75,4.1],['GOLD','Gold','MCX',147866,.35],['GOLDM','Gold Mini','MCX',147729,.31]].map(a=>mk({id:a[0],n:a[1],ex:a[2],ltp:a[3],pc:a[3]/(1+a[4]/100),d:a[3]<100?2:1,t:'FUT',idx:0,oi:0,oc:0}));
let IDX=fallbackIDX,COM=fallbackCOM;
const S={tab:'m',f:{m:'all',c:'all'},sort:0,sel:null,live:false,backend:null,error:null};
const M=[['all','All'],['NSE','NSE'],['BSE','BSE']],C=[['all','All'],['crude','Crude'],['gas','Gas'],['gold','Gold'],['fut','Futures']];
const spark=(s,w,h)=>{const a=s||[],mn=Math.min(...a),r=Math.max(...a)-mn||1;return a.map((v,i)=>(i/(a.length-1||1)*w).toFixed(1)+','+(h-2-(v-mn)/r*(h-4)).toFixed(1)).join(' ')};
const SP='<svg class="sp" viewBox="0 0 56 24"><polyline fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>',PR='<div class="pr"><div class="lt"></div><br><span class="ch"></span><div class="cp"></div></div>';
const tag=x=>'<span class="bd '+(x.t||'FUT')+'">'+((x.t||'FUT')==='FUT'?'FUT':x.t+' '+(x.st||''))+'</span>';
function normalizeRows(snap){
  const arr=[];
  const data=snap&&snap.data;
  const items=(snap&&snap.market&&snap.market.indices)||(snap&&snap.indices)||(data&&data.indices)||[];
  for(const x of items){if(!x)continue;const n=x.name||x.symbol||x.tradingsymbol;if(n)arr.push(mk({id:x.symbol||x.token||n,n,ex:x.exchange||x.ex||'NSE',ltp:Number(x.ltp??x.lastPrice??x.close??0),pc:Number(x.pc??x.prevClose??x.previousClose??x.close??x.ltp??0),d:2,idx:1,hi:Number(x.high??x.ltp??0),lo:Number(x.low??x.ltp??0),s:x.series||x.s})))}
  return arr.length?arr:null;
}
function normalizeCom(snap){
  const src=(snap&&snap.commodity&&snap.commodity.items)||(snap&&snap.commodities)||[];
  return src.map(x=>mk({id:x.symbol||x.tradingsymbol||x.name,n:x.name||x.symbol,ex:x.exchange||'MCX',ltp:Number(x.ltp??x.lastPrice??0),pc:Number(x.pc??x.prevClose??x.previousClose??x.ltp??0),d:Number(x.ltp)<100?2:1,t:x.type||'FUT',oi:Number(x.oi||0),oc:Number(x.oiChange||x.oc||0),idx:0})).filter(x=>x.n&&x.ltp);
}
function applySnapshot(snap){
  S.backend=snap;
  const mi=normalizeRows(snap),mc=normalizeCom(snap);if(mi)IDX=mi;if(mc&&mc.length)COM=mc;
  S.live=!!(snap.connection?.server||snap.connection?.angel||snap.angel_api?.connected||snap.ok);
  S.error=null;render();
}
async function refresh(){
  try{const snap=await getJson('/api/snapshot');applySnapshot(snap);return}catch(_){}
  try{const snap=await getJson('/api/overview');applySnapshot(snap);return}catch(_){}
  try{const snap=await getJson('/terminal');applySnapshot(snap);return}catch(_){}
  S.error='Backend snapshot unavailable — showing local preview data.';S.live=false;render();
}
let wsStarted=false;
function connectWS(){
  if(wsStarted)return; wsStarted=true;
  for(const u of wsUrls()){try{const ws=new WebSocket(u);ws.onopen=()=>{S.live=true;S.error=null;render()};ws.onmessage=e=>{try{applySnapshot(JSON.parse(e.data))}catch(_){}};ws.onerror=()=>{};ws.onclose=()=>{wsStarted=false;if(S.live){S.live=false;render()}setTimeout(connectWS,4000)};return}catch(_){}}
}
function view(){const t=S.tab,f=S.f[t];let a=(t==='m'?IDX:COM).filter(x=>t==='m'?(f==='all'||x.ex===f):(f==='all'||(f==='fut'?x.t==='FUT':true)));if(t==='m'&&S.sort)a=[...a].sort((p,q)=>(pct(q)-pct(p))*(S.sort===1?1:-1));return a}
function paint(x,el,fl){if(!el)return;const up=Number(x.ltp)>=Number(x.pc),L=el.querySelector('.lt'),H=el.querySelector('.ch'),sp=el.querySelector('.sp'),r=el.querySelector('.rg i');L.textContent=fmt(x.ltp,x.d);if(fl){L.classList.remove('fu','fd');void L.offsetWidth;L.classList.add(fl)}H.textContent=(up?'▲':'▼')+' '+Math.abs(pct(x)).toFixed(2)+'%';H.classList.toggle('u',up);H.classList.toggle('d',!up);el.querySelector('.cp').textContent=(up?'+':'−')+fmt(Math.abs(Number(x.ltp)-Number(x.pc)),x.d);sp.classList.toggle('u',up);if(sp.firstChild)sp.firstChild.setAttribute('points',spark(x.s||[x.pc,x.ltp],56,24));if(r&&x.hi>x.lo)r.style.left=((x.ltp-x.lo)/(x.hi-x.lo)*100)+'%'}
function breadth(){const b=$('#brd');if(!b)return;const u=IDX.filter(x=>x.ltp>=x.pc).length,d=IDX.length-u;b.innerHTML='<div class="sub"><span class="u">'+u+' rising</span> · <span class="d">'+d+' falling</span> across '+IDX.length+' indices</div><div class="br"><span style="flex:'+(u||.001)+';background:var(--up)"></span><span style="flex:'+(d||.001)+';background:var(--dn)"></span></div>'}
function render(){const t=S.tab,m=t==='m',a=view();$('#ttl').textContent=m?'Market':'Commodity';document.querySelectorAll('.nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t));const chips=(m?M:C).map(c=>'<button class="chip" aria-pressed="'+(S.f[t]===c[0])+'" data-f="'+c[0]+'">'+c[1]+'</button>').join('')+(m?'<button class="chip" data-sort>Sort: '+(['default','Top gainers','Top losers'][S.sort])+'</button>':'');app.innerHTML='<div class="src"><span class="dot '+(S.live?'ok':'bad')+'"></span><div><b>Angel One SmartAPI</b><div class="sub">'+(S.live?'<span class="live">Live backend · WebSocket</span>':'<span class="sample">Preview / fallback</span>')+'</div></div><div class="sub rt">'+(S.backend?.market_open?'Market open':'Server feed')+'<br><span id="clk">--:--:--</span></div></div>'+(m?'<div class="bw" id="brd"></div>':'')+(S.error?'<div class="err">'+S.error+'</div>':'')+'<div class="chips">'+chips+'</div><div class="list">'+a.map(x=>'<button class="row" data-id="'+String(x.id).replace(/"/g,'&quot;')+'">'+(m?'<div><div class="nm">'+x.n+' <span class="tg">'+x.ex+'</span></div><div class="rg"><i></i></div></div>'+SP+PR:'<div><div class="nm">'+x.n+' '+tag(x)+'</div><div class="sub">'+(x.oi?'OI '+fmt(x.oi,0)+' <span class="'+(x.oc>=0?'u':'d')+'">'+(x.oc>=0?'+':'−')+fmt(Math.abs(x.oc),0)+'</span>':'No OI · feed pending')+'</div><div class="oib"><b style="width:'+Math.min(100,(x.oi||0)/Math.max(1,...COM.map(c=>c.oi||0))*100)+'%"></b></div></div>'+SP+PR)+'</button>').join('')+'</div>';a.forEach(x=>paint(x,app.querySelector('[data-id="'+CSS.escape(String(x.id))+'"]')));breadth();const k=$('#clk');if(k)k.textContent=new Date().toLocaleTimeString('en-IN',{hour12:false})}
function chart(x){const s=x.s||[x.pc,x.ltp],w=320,h=110,mn=Math.min(...s,x.pc),r=Math.max(...s,x.pc)-mn||1,Y=v=>(h-6-(v-mn)/r*(h-12)).toFixed(1),p=s.map((v,i)=>(i/(s.length-1||1)*w).toFixed(1)+','+Y(v)).join(' ');return '<svg viewBox="0 0 '+w+' '+h+'" class="ch2 '+(x.ltp>=x.pc?'u':'d')+'"><line x1="0" x2="'+w+'" y1="'+Y(x.pc)+'" y2="'+Y(x.pc)+'" stroke="var(--mu)" stroke-dasharray="3 4" opacity=".6"/><polyline points="'+p+'" fill="none" stroke="currentColor" stroke-width="2"/></svg>'}
function sheet(){const x=S.sel,sh=$('#sh');if(!x){sh.hidden=true;return}sh.hidden=false;const up=x.ltp>=x.pc,c=up?'u':'d',rows=[['Open',fmt((x.s||[x.ltp])[0],x.d)],['Prev close',fmt(x.pc,x.d)],['Day high',fmt(x.hi||x.ltp,x.d)],['Day low',fmt(x.lo||x.ltp,x.d)],['Exchange',x.ex],['Source',S.live?'Backend / Angel One':'Local preview']];if(x.oi!==undefined)rows.push(['Open interest',x.oi?fmt(x.oi,0):'No OI'],['OI change',(x.oc>=0?'+':'−')+fmt(Math.abs(x.oc||0),0)]);sh.innerHTML='<div class="card" role="dialog" aria-modal="true"><div class="hd"><div><div class="nm">'+x.n+(x.idx?'':' '+tag(x))+'</div><div class="sub">'+x.ex+'</div></div><button class="ib" data-x aria-label="Close">×</button></div><div class="big '+c+'">'+fmt(x.ltp,x.d)+'</div><span class="ch '+c+'">'+(up?'▲':'▼')+' '+Math.abs(pct(x)).toFixed(2)+'%</span> <span class="sub">'+(up?'+':'−')+fmt(Math.abs(x.ltp-x.pc),x.d)+' today</span>'+chart(x)+'<div class="gr">'+rows.map(r=>'<div><small>'+r[0]+'</small><b>'+r[1]+'</b></div>').join('')+'</div><p class="sub note">Live values are server supplied. Angel One credentials remain server-side; this dashboard never places orders.</p></div>'}
app.addEventListener('click',e=>{const c=e.target.closest('.chip'),r=e.target.closest('.row');if(c){if(c.dataset.sort!==undefined)S.sort=(S.sort+1)%3;else S.f[S.tab]=c.dataset.f;render()}else if(r){S.sel=([...IDX,...COM]).find(x=>String(x.id)===String(r.dataset.id));sheet()}});
$('#sh').addEventListener('click',e=>{if(e.target.id==='sh'||e.target.closest('[data-x]')){S.sel=null;sheet()}});addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sel){S.sel=null;sheet()}});
$('.nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b){S.tab=b.dataset.t;S.sel=null;sheet();render();scrollTo(0,0)}});$('#th').onclick=()=>{const d=document.documentElement,cur=d.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');d.dataset.theme=cur==='dark'?'light':'dark'};$('#rf').onclick=refresh;
window.bootstrapDashboard=()=>{API=(window.DASH_API_BASE||localStorage.getItem('dash_api_base')||'').replace(/\/$/,'');TOKEN=window.DASH_TOKEN||localStorage.getItem('dash_token')||'';refresh();connectWS();};
render();
if(API) window.bootstrapDashboard();
setInterval(()=>{const k=$('#clk');if(k)k.textContent=new Date().toLocaleTimeString('en-IN',{hour12:false})},1000);
</script>
</body>
</html>
