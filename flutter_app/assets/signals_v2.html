<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Signals · Angel One Engine</title>
<style>:root{--bg:#0A1020;--s1:#111A2E;--s2:#1B2740;--tx:#E8EDF7;--mu:#8D9BB8;--ln:#222F4A;--up:#2BD08A;--dn:#FF6369;--ac:#5B8CFF;--am:#F0B429}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 0 24px;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif}.top{position:sticky;top:0;padding:14px 16px;background:var(--bg);display:flex;justify-content:space-between;z-index:2}h1{margin:0;font-size:27px}.ib{width:40px;height:40px;border:0;border-radius:12px;background:var(--s1);color:var(--tx)}.eng,.cfg,.card,.summary,.notice{margin:8px 16px;padding:13px;border-radius:15px;background:var(--s1)}.eng{display:flex;align-items:center;gap:10px}.dot{width:10px;height:10px;border-radius:50%;background:var(--am)}.dot.live{background:var(--up)}.dot.err{background:var(--dn)}.muted{color:var(--mu);font-size:12px}.pill{margin-left:auto;padding:4px 9px;border-radius:99px;background:rgba(43,208,138,.14);color:var(--up);font-size:12px}.bad{background:rgba(255,99,105,.14);color:var(--dn)}.cfg input{width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);margin:8px 0}.btn{padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--s2);color:var(--tx)}.primary{background:var(--ac);border-color:var(--ac);color:#fff}.summary{display:flex;gap:8px;overflow:auto}.summary span{white-space:nowrap;padding:6px 10px;background:var(--s2);border-radius:99px}.list{display:grid;gap:10px}.card{border-left:4px solid var(--am)}.card.c{border-color:var(--up)}.card.p{border-color:var(--dn)}.head{display:flex;justify-content:space-between;gap:8px}.verdict{font-weight:700;padding:5px 9px;border-radius:9px;background:var(--s2)}.c .verdict{background:rgba(43,208,138,.14);color:var(--up)}.p .verdict{background:rgba(255,99,105,.14);color:var(--dn)}.grid{display:grid;grid-template-columns:1fr 1fr;margin-top:10px;background:var(--ln);gap:1px;border-radius:10px;overflow:hidden}.grid div{padding:9px;background:var(--s1)}.grid small{display:block;color:var(--mu)}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.tags span{padding:3px 7px;border-radius:7px;background:var(--s2);font-size:12px}.ok{color:var(--up)}.no{color:var(--dn)}.ai{width:100%;margin-top:10px;padding-top:10px;border:0;border-top:1px solid var(--ln);background:none;color:var(--tx);text-align:left}.layers{display:grid;gap:8px;margin-top:8px}.layer{font-size:13px}.notice{color:var(--mu);font-size:13px}</style>
</head><body><header class="top"><h1>Signals</h1><button class="ib" id="theme">◐</button></header>
<section class="eng"><i class="dot" id="dot"></i><div><b id="status">Starting…</b><div class="muted" id="cycle">Engine cycle –</div></div><span class="pill" id="gate">Data gate –</span></section>
<section class="cfg" id="cfg" hidden><div class="muted">Signal Engine WebSocket</div><input id="url"><button class="btn primary" id="connect">Connect live</button> <button class="btn" id="demo">Demo</button></section>
<div class="summary" id="summary"></div><main class="list" id="list"></main><div class="notice">Paper only. No order placement. Confidence is a heuristic score, not a win rate.</div>
<script>
var base=window.DASH_API_BASE||localStorage.getItem("dash_api_base")||"";var ws=null,timer=null,frame=null;var opened={};
function esc(v){return String(v==null?"":v).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]})}
function num(v){return Number(v||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})}
function setStatus(cls,title,sub){document.getElementById("dot").className="dot "+cls;document.getElementById("status").textContent=title;document.getElementById("cycle").textContent=sub||""}
function layers(x){return x&&x.ai&&Array.isArray(x.ai.layers)?x.ai.layers:[]}
function card(x){var v=x.verdict||"WAIT";var cls=v==="CALL BUY"?"c":v==="PUT BUY"?"p":"";var L=layers(x),open=!!opened[x.sym];var h="<article class=\"card "+cls+"\"><div class=\"head\"><div><b>"+esc(x.sym)+"</b><div class=\"muted\">Spot "+num(x.spot)+"</div></div><span class=\"verdict\">"+esc(v)+"</span></div>";
if(x.opt){h+="<div class=\"grid\">";var rows=[["Option",x.opt],["Strike",x.strike],["Entry",num(x.entry)],["Stop loss",num(x.sl)],["Target 1",num(x.t&&x.t[0])],["Target 2",num(x.t&&x.t[1])],["R:R","1 : "+Number(x.rr||0).toFixed(1)],["Confidence",(x.conf||0)+" / 100"]];for(var i=0;i<rows.length;i++)h+="<div><small>"+esc(rows[i][0])+"</small><b>"+esc(rows[i][1])+"</b></div>";h+="</div><div class=\"tags\">";(x.ids||[]).forEach(function(t){h+="<span>"+esc(t)+"</span>"});h+="</div><div class=\"tags\">";(x.checks||[]).forEach(function(c){h+="<span class=\""+(c[1]?"ok":"no")+"\">"+(c[1]?"✓":"✕")+" "+esc(c[0])+"</span>"});h+="</div>"}else h+="<div class=\"muted\" style=\"margin-top:9px\">"+esc(x.why||"No qualifying setup")+"</div>";
if(L.length){h+="<button class=\"ai\" data-s=\""+esc(x.sym)+"\">AI "+L.filter(function(l){return l.s==="pass"}).length+"/"+L.length+" validated · "+(open?"Hide":"Details")+"</button>";if(open){h+="<div class=\"layers\">";L.forEach(function(l){h+="<div class=\"layer\"><b>L"+esc(l.n)+" "+esc(l.role)+"</b> · "+esc(l.model)+"<div class=\"muted\">"+esc(l.note)+"</div></div>"});h+="</div>"}}return h+"</article>"}
function apply(fr){frame=fr||{};var a=fr.items||[],c=a.filter(function(x){return x.verdict==="CALL BUY"}).length,p=a.filter(function(x){return x.verdict==="PUT BUY"}).length;document.getElementById("summary").innerHTML="<span class=\"ok\">"+c+" CALL BUY</span><span class=\"no\">"+p+" PUT BUY</span><span>"+(a.length-c-p)+" no entry</span>";var sig=a.filter(function(x){return x.verdict==="CALL BUY"||x.verdict==="PUT BUY"});document.getElementById("list").innerHTML=(sig.length?sig.map(card).join(""):"<article class=\"card\"><b>No high-quality entry right now</b><div class=\"muted\">Engine keeps scanning until all gates and AI layers validate.</div></article>");if(fr.dq){var g=document.getElementById("gate");g.textContent=fr.dq.ok?"Data gate pass":"Data gate blocked";g.className="pill"+(fr.dq.ok?"":" bad")}document.getElementById("cycle").textContent="Cycle "+(fr.cycle||0)+" · data age "+(fr.dq&&fr.dq.age_ms!=null?fr.dq.age_ms:"-")+" ms"}
document.getElementById("list").onclick=function(e){var b=e.target.closest(".ai");if(!b)return;opened[b.dataset.s]=!opened[b.dataset.s];apply(frame)};
function stop(){if(timer)clearInterval(timer);timer=null;if(ws){ws.onclose=null;ws.close();ws=null}}
function live(){stop();var u=document.getElementById("url").value.trim();if(!u){setStatus("err","WebSocket URL missing");return}setStatus("","Connecting…",u);ws=new WebSocket(u);ws.onopen=function(){setStatus("live","Live · Angel One engine")};ws.onmessage=function(e){try{apply(JSON.parse(e.data))}catch(_){}};ws.onerror=function(){setStatus("err","Connection error","Check signal_engine.py / Railway backend")};ws.onclose=function(){setStatus("err","Disconnected","Reconnect from settings")}}
function demo(){setStatus("","Demo stream · synthetic data");var sy=["NIFTY","BANKNIFTY","FINNIFTY","MIDCPNIFTY","SENSEX","BANKEX"];var items=sy.map(function(s,i){return {sym:s,spot:[24980,55240,26115,12640,81420,61356][i],verdict:i===0?"WAIT":"NO QUALIFYING TRADE",why:"Demo only — connect Angel One engine for live six-layer validation"}});apply({cycle:1,ts:Date.now(),dq:{ok:true,age_ms:120},items:items})}
document.getElementById("connect").onclick=live;document.getElementById("demo").onclick=demo;document.getElementById("cfg").hidden=false;document.getElementById("theme").onclick=function(){document.documentElement.style.filter=document.documentElement.style.filter?"":"brightness(.82)"};
window.bootstrapSignals=function(){try{var u=new URL(base);u.protocol=u.protocol==="https:"?"wss:":"ws:";u.pathname="/ws/signals";u.search="";document.getElementById("url").value=u.toString();if(u.toString())live();else demo()}catch(e){demo()}};window.bootstrapSignals();
</script></body></html>
