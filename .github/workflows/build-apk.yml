name: Build NSE Algo Trading APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform
        working-directory: flutter_app
        run: flutter create . --platforms=android --project-name algo_terminal

      - name: Remove generated sample test
        working-directory: flutter_app
        run: rm -rf test
      - name: Configure Android desugaring
        working-directory: flutter_app
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          if p.exists():
              s = p.read_text()
              if "isCoreLibraryDesugaringEnabled" not in s:
                  s = s.replace(
                      "    compileOptions {",
                      "    compileOptions {\n"
                      "        isCoreLibraryDesugaringEnabled = true",
                      1,
                  )
              if "coreLibraryDesugaring(" not in s:
                  s += (
                      "\n\ndependencies {\n"
                      "    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.4\")\n"
                      "}\n"
                  )
              p.write_text(s)
          else:
              p = Path("android/app/build.gradle")
              s = p.read_text()
              if "coreLibraryDesugaringEnabled" not in s:
                  s = s.replace(
                      "    compileOptions {",
                      "    compileOptions {\n"
                      "        coreLibraryDesugaringEnabled true",
                      1,
                  )
              if "coreLibraryDesugaring" not in s:
                  s += (
                      "\n\ndependencies {\n"
                      "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n"
                      "}\n"
                  )
              p.write_text(s)
          PY
          grep -n "CoreLibraryDesugaring\|coreLibraryDesugaring\|desugar_jdk_libs" android/app/build.gradle* || true
          # Puter.js runs inside webview_flutter. webview_flutter_android 4.10.x requires Android API 24+.
          python - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace("minSdk = flutter.minSdkVersion", "minSdk = 24")
          p.write_text(s)
          PY
          grep -q "minSdk = 24" android/app/build.gradle.kts
          test -f android/app/build.gradle.kts
          grep -q "isCoreLibraryDesugaringEnabled = true" android/app/build.gradle.kts
          grep -q "coreLibraryDesugaring" android/app/build.gradle.kts
          grep -q "desugar_jdk_libs:2.1.4" android/app/build.gradle.kts

      - name: Enable internet access
        working-directory: flutter_app
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if "android.permission.INTERNET" not in s:
              s = s.replace("<manifest ", '<manifest ')
              s = s.replace("xmlns:android=", 'xmlns:android=', 1)
              marker = "<application"
              s = s.replace(marker, '<uses-permission android:name="android.permission.INTERNET"/>\n    ' + marker, 1)
          s = s.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          p.write_text(s)
          PY
          grep -n "INTERNET\|usesCleartextTraffic" android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Validate backend Python source
        working-directory: backend
        run: python -m py_compile *.py

      - name: Validate Dart source
        working-directory: flutter_app
        run: |
          set +e
          flutter analyze --no-fatal-warnings 2>&1 | tee flutter-analyze.log
          rc=${PIPESTATUS[0]}
          if grep -qE '^ *error •' flutter-analyze.log; then
            echo 'Dart/Flutter analyzer found real errors.'
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "Analyzer returned $rc but reported no error-level diagnostics; continuing."
          fi

      - name: Validate Railway backend URL
        env:
          RAILWAY_BACKEND_URL: ${{ vars.RAILWAY_BACKEND_URL || 'https://nse-algo-backend-production.up.railway.app' }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse

          raw = os.environ.get("RAILWAY_BACKEND_URL", "").strip()
          if not raw:
              raise SystemExit("RAILWAY_BACKEND_URL GitHub Actions variable is missing.")
          if not raw.startswith("https://"):
              raise SystemExit("RAILWAY_BACKEND_URL must use HTTPS.")
          host = urlparse(raw).hostname or ""
          if host != "railway.app" and not host.endswith(".railway.app"):
              raise SystemExit(f"RAILWAY_BACKEND_URL must point to Railway (*.railway.app), got: {host}")
          print("Railway backend URL validated:", host)
          PY
      - name: Build installable APK
        working-directory: flutter_app
        run: |
          set -o pipefail
          flutter build apk --debug --dart-define=RAILWAY_BACKEND_URL="${{ vars.RAILWAY_BACKEND_URL || 'https://nse-algo-backend-production.up.railway.app' }}" 2>&1 | tee flutter-build.log

      - name: Upload Flutter build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log
          path: flutter_app/flutter-build.log
          if-no-files-found: warn

      - name: Verify APK
        run: |
          test -f flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          ls -lh flutter_app/build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NSE-Algo-Trading-18-Screen-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
