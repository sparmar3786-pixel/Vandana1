name: Build NSE Algo Trading APK
on:
  push:
    branches: [main, feature-v2-ui-polish-market-chart, feature-v2-ui-polish-market-chart-fixed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform
        working-directory: flutter_app
        run: flutter create . --platforms=android --project-name algo_terminal

      - name: Enable internet access
        working-directory: flutter_app
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if "android.permission.INTERNET" not in s:
              s = s.replace("<manifest ", '<manifest ')
              s = s.replace("xmlns:android=", 'xmlns:android=', 1)
              marker = "<application"
              s = s.replace(marker, '<uses-permission android:name="android.permission.INTERNET"/>\n    ' + marker, 1)
          s = s.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          p.write_text(s)
          PY
          grep -n "INTERNET\|usesCleartextTraffic" android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Validate Dart source
        working-directory: flutter_app
        run: dart analyze --no-fatal-warnings

      - name: Build installable APK
        working-directory: flutter_app
        run: flutter build apk --debug

      - name: Verify APK
        run: |
          test -f flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          ls -lh flutter_app/build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NSE-Algo-Trading-18-Screen-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
