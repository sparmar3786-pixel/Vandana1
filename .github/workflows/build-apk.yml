name: Build NSE Algo Trading APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform
        working-directory: flutter_app
        run: flutter create . --platforms=android --project-name algo_terminal

      - name: Configure Android desugaring
        working-directory: flutter_app
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          if p.exists():
              s = p.read_text()
              if "isCoreLibraryDesugaringEnabled" not in s:
                  s = s.replace(
                      "    compileOptions {",
                      "    compileOptions {\n"
                      "        isCoreLibraryDesugaringEnabled = true",
                      1,
                  )
              if "coreLibraryDesugaring(" not in s:
                  s += (
                      "\n\ndependencies {\n"
                      "    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.4\")\n"
                      "}\n"
                  )
              p.write_text(s)
          else:
              p = Path("android/app/build.gradle")
              s = p.read_text()
              if "coreLibraryDesugaringEnabled" not in s:
                  s = s.replace(
                      "    compileOptions {",
                      "    compileOptions {\n"
                      "        coreLibraryDesugaringEnabled true",
                      1,
                  )
              if "coreLibraryDesugaring" not in s:
                  s += (
                      "\n\ndependencies {\n"
                      "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n"
                      "}\n"
                  )
              p.write_text(s)
          PY
          grep -n "CoreLibraryDesugaring\|coreLibraryDesugaring\|desugar_jdk_libs" android/app/build.gradle* || true
          test -f android/app/build.gradle.kts
          grep -q "isCoreLibraryDesugaringEnabled = true" android/app/build.gradle.kts
          grep -q "coreLibraryDesugaring" android/app/build.gradle.kts
          grep -q "desugar_jdk_libs:2.1.4" android/app/build.gradle.kts

      - name: Enable internet access
        working-directory: flutter_app
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if "android.permission.INTERNET" not in s:
              s = s.replace("<manifest ", '<manifest ')
              s = s.replace("xmlns:android=", 'xmlns:android=', 1)
              marker = "<application"
              s = s.replace(marker, '<uses-permission android:name="android.permission.INTERNET"/>\n    ' + marker, 1)
          s = s.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          p.write_text(s)
          PY
          grep -n "INTERNET\|usesCleartextTraffic" android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Validate Dart source
        working-directory: flutter_app
        run: dart analyze --no-fatal-warnings || true

      - name: Build installable APK
        working-directory: flutter_app
        run: flutter build apk --debug

      - name: Verify APK
        run: |
          test -f flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          ls -lh flutter_app/build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NSE-Algo-Trading-18-Screen-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
