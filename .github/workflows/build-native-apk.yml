name: Build Native Android APK

on:
  push:
    branches:
      - native-android-live-terminal
      - main
  workflow_dispatch:

jobs:
  build-native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native_android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NSE-ALGO-NATIVE-debug
          path: native_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
